<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OceanEmbed | Predict</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="oceanembed.css">
    <link rel="stylesheet" href="satellite-predict.css">
    <link rel="manifest" href="manifest.json">
    <script src="playcanvas-stable.min.js"></script>
    <script src="gsap.min.js"></script>
    <script src="__settings__.js"></script>
  </head>
  <body>
    <a id="oceanembed-back" href="index.html">&larr; Back to OceanEmbed</a>
    <section id="oceanembed-params" aria-labelledby="oceanembed-params-title">
      <p class="eyebrow">OCEANEMBED | PREDICTION PARAMETERS</p>
      <h1 id="oceanembed-params-title">Choose a date and location</h1>
      <form id="oceanembed-params-form" action="prediction.html" method="get">
        <label>Latitude (5&deg;N to 30&deg;N)
          <input name="latitude" type="number" min="5" max="30" step="0.25" value="15" required>
        </label>
        <label>Longitude (45&deg;E to 105&deg;E)
          <input name="longitude" type="number" min="45" max="105" step="0.25" value="75" required>
        </label>
        <label class="date-field">Target date
          <input name="date" type="date" required>
        </label>
        <button type="submit">PREDICT &rarr;</button>
      </form>
    </section>
    <script src="__modules__.js"></script>
    <script src="__start__.js"></script>
    <script src="__loading__.js"></script>
    <script src="satellite-predict.js"></script>
  </body>
</html>
